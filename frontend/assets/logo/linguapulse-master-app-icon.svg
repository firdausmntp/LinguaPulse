  <!-- Geometric Upper Loop of 'P' (Precision Language Arc) -->
  <path d="M 78 52
           L 144 52
           C 174 52, 194 68, 194 94
           C 194 120, 174 136, 144 136
           L 78 136 Z"
        fill="#2563EB"/>

  <!-- Inner Architectural Cutout of 'P' -->
  <path d="M 104 74
           L 138 74
           C 152 74, 166 82, 166 94
           C 166 106, 152 114, 138 114
           L 104 114 Z"
        fill="#0F172A"/>

  <!-- Precision Cadence Bar (The 'Pulse' of Fluency & Telemetry) -->
