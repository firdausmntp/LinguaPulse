<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="LinguaPulse Logo">
  <defs>
    <linearGradient id="lpTileGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090E1A"/>
    </linearGradient>
  </defs>

  <!-- Deep Oxford Night Squircle Tile -->
  <rect width="256" height="256" rx="54" fill="url(#lpTileGrad)"/>

  <!-- Left Foundation Stem: Monogram 'L' Spine -->
  <rect x="52" y="48" width="26" height="156" rx="7" fill="#FFFFFF"/>

